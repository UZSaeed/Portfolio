<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyAllen</title>
  <meta name="description" content="Browse, plot, and analyze real neuron recordings from the Allen Cell Types Database in your browser. No code or installs.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/easyallen.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="EasyAllen home">
      <span class="brand-mark" data-sprite="neuron" data-scale="2"></span>
      <span class="brand-name">EasyAllen</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/cells" data-nav="cells">Cells</a>
      <a href="#/compare" data-nav="compare">Compare</a>
      <a href="#/guide" data-nav="guide">Guide</a>
      <a class="nav-cta" href="#/lab" data-nav="lab">Firing patterns lab</a>
    </nav>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="statusbar" aria-live="polite">
    <span class="status-dot" id="status-dot" data-state="idle"></span>
    <span id="status-text">Ready</span>
    <span class="status-spacer"></span>
    <span class="status-meta">Data: <a href="https://celltypes.brain-map.org/" target="_blank" rel="noopener">Allen Cell Types Database</a></span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
